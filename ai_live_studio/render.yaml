services:
  - type: web
    name: ai-live-studio
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-live-studio-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: ai-live-studio-db
    plan: free
    databaseName: ai_live_studio
    user: ai_live_studio
