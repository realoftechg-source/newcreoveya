{% extends 'base_public.html' %}
{% block title %}Forgot password — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <a href="{% url 'landing' %}" class="navbar-brand-gradient fs-4 fw-bold text-decoration-none">
        <img src="/static/img/logo-mark.svg" alt="Creoveya" style="height:24px;width:24px;" class="me-1">Creoveya
      </a>
      <h4 class="mt-3 mb-1">Forgot your password?</h4>
      <p class="text-muted-soft small">We'll email you a link to reset it.</p>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-4">
        <label>Email address</label>
        {{ form.email }}
      </div>
      <button type="submit" class="btn btn-gradient w-100 mb-3">Send Reset Link</button>
      <p class="text-center small text-muted-soft mb-0">
        <a href="{% url 'accounts:login' %}"><i class="bi bi-arrow-left"></i> Back to login</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
