{% extends 'base_public.html' %}
{% block title %}Reset password — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <a href="{% url 'landing' %}" class="navbar-brand-gradient fs-4 fw-bold text-decoration-none">
        <img src="/static/img/logo-mark.svg" alt="Creoveya" style="height:24px;width:24px;" class="me-1">Creoveya
      </a>
      <h4 class="mt-3 mb-1">Set a new password</h4>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label>New password</label>
        {{ form.password1 }}
      </div>
      <div class="mb-4">
        <label>Confirm new password</label>
        {{ form.password2 }}
      </div>
      {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
      <button type="submit" class="btn btn-gradient w-100">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
