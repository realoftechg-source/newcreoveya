{% extends 'base_public.html' %}
{% block title %}Log in — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <a href="{% url 'landing' %}" class="navbar-brand-gradient fs-4 fw-bold text-decoration-none">
        <img src="/static/img/logo-mark.svg" alt="Creoveya" style="height:24px;width:24px;" class="me-1">Creoveya
      </a>
      <h4 class="mt-3 mb-1">Welcome back</h4>
      <p class="text-muted-soft small">Log in to your dashboard.</p>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label>Username or email</label>
        {{ form.username }}
      </div>
      <div class="mb-2">
        <label>Password</label>
        {{ form.password }}
      </div>
      <div class="text-end mb-4">
        <a href="{% url 'accounts:forgot_password' %}" class="small">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-gradient w-100 mb-3">Log In</button>
      <p class="text-center small text-muted-soft mb-0">
        Don't have an account? <a href="{% url 'accounts:register' %}">Sign up free</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
